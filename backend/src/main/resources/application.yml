spring:
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/lolog?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:lolog}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

admin:
  initial-password: ${ADMIN_INITIAL_PASSWORD:changeme}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
